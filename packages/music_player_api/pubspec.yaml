version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0-0
  
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.1.0
  items_repository:
    path: ../items_repository
  jellyflut_models:

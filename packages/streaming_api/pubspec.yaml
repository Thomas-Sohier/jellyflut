version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.9.0-0
  
resolution: workspace

dependencies:
  dio: ^5.9.0
  flutter:
    sdk: flutter
  jellyflut_models:
    path: ../jellyflut_models

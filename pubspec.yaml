name: jellyflut
description: Jellyfin client made with Flutter.

publish_to: "none"
version: 2.0.0
environment:
  sdk: ^3.9.0-0
workspace:
  - packages/authentication_api
  - packages/authentication_repository
  - packages/database_downloads_api
  - packages/downloads_api
  - packages/downloads_repository
  - packages/items_api
  - packages/items_repository
  - packages/jellyfin_authentication_api
  - packages/jellyfin_downloads_api
  - packages/jellyflut_models
  - packages/live_tv_api
  - packages/live_tv_repository
  - packages/music_player_api
  - packages/music_player_repository
  - packages/remote_downloads_api
  - packages/settings_repository
  - packages/sqlite_database
  - packages/streaming_api
  - packages/streaming_repository
  - packages/users_api
  - packages/users_repository

dependencies:
  animated_fractionally_sized_box: ^2.0.1
  animations: ^2.0.7
  archive: ^4.0.7
  audio_video_progress_bar: ^2.0.3
  authentication_repository:
    path: packages/authentication_repository
  auto_route: ^10.1.2
  blurhash_ffi: ^1.2.7
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1
  community_material_icon: ^5.9.55
  database_downloads_api:
    path: packages/database_downloads_api
  device_info_plus: ^12.1.0
  dio: ^5.9.0
  downloads_api:
    path: packages/downloads_api
  downloads_repository:
    path: packages/downloads_repository
  drop_shadow: ^0.1.0
  easy_localization: ^3.0.8
  easy_localization_loader: ^2.0.2
  equatable: ^2.0.7
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_colorpicker: ^1.1.0
  flutter_native_splash: ^2.4.6
  flutter_settings_ui: ^2.0.1
  flutter_svg: ^2.2.1
  fluttertoast: ^9.0.0
  hydrated_bloc: ^10.1.1
  intl: ^0.20.2
  items_api:
    path: packages/items_api
  items_repository:
    path: packages/items_repository
  jellyfin_authentication_api:
    path: packages/jellyfin_authentication_api
  jellyfin_downloads_api:
    path: packages/jellyfin_downloads_api
  jellyflut_models:
    path: packages/jellyflut_models
  json_serializable: ^6.11.1
  live_tv_api:
    path: packages/live_tv_api
  live_tv_repository:
    path: packages/live_tv_repository
  material_color_utilities: ^0.11.0
  music_player_api:
    path: packages/music_player_api
  music_player_repository:
    path: packages/music_player_repository
  octo_image: ^2.1.0
  package_info_plus: ^9.0.0
  path: 1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  photo_view: ^0.15.0
  provider: ^6.1.5+1
  reactive_forms: ^18.1.1
  remote_downloads_api:
    path: packages/remote_downloads_api
  responsive_builder: ^0.7.1
  rxdart: ^0.28.0
  settings_repository:
    path: packages/settings_repository
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sliver_tools: ^0.2.12
  sqlite3_flutter_libs: ^0.5.39
  sqlite_database:
    path: packages/sqlite_database
  streaming_api:
    path: packages/streaming_api
  streaming_repository:
    path: packages/streaming_repository
  url_launcher: ^6.3.2
  users_api:
    path: packages/users_api
  users_repository:
    path: packages/users_repository
  uuid: ^4.5.1
  wakelock_plus: ^1.4.0

dev_dependencies:
  dependency_validator: ^5.0.2
  auto_route_generator: ^10.2.4
  lean_builder: ^0.1.1
  build_web_compilers: ^4.2.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  icons_launcher: ^3.0.3

# The following section is specific to Flutter.
flutter:
  assets:
    - img/
    - img/icon/
    - assets/translations/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Italic.ttf
          style: italic
        - asset: fonts/Poppins-Regular.ttf
          style: normal
    - family: HindMadurai
      fonts:
        - asset: fonts/HindMadurai-Regular.ttf
          style: normal
    - family: Quicksand
      fonts:
        - asset: fonts/Quicksand-Regular.ttf
          style: normal

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
